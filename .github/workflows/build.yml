name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --console=plain --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error title=GRADLE::$(grep -A8 'What went wrong' build.log | head -12 | sed 's/%/%25/g' | paste -sd '|')"
            echo "::error title=KOTLIN::$(grep -E '^e: ' build.log | head -10 | sed 's/%/%25/g' | paste -sd '|')"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneOptimizer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
